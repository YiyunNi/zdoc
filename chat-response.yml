            - paragraph [ref=e435]: What is Zilliz Cloud?
            - generic [ref=e436]:
              - img [ref=e438]
              - generic [ref=e439]:
                - generic [ref=e447]: General Assistant
                - paragraph [ref=e448]:
                  - text: Zilliz Cloud is a
                  - strong [ref=e449]: fully managed Milvus service
                  - text: that simplifies the deployment, scaling, and operation of vector search applications with built-in security.
                - heading "What it provides" [level=2] [ref=e450]
                - list [ref=e451]:
                  - listitem [ref=e452]:
                    - strong [ref=e453]: Managed vector database
                    - text: — No infrastructure to provision or maintain; Zilliz handles scaling, backups, and updates.
                  - listitem [ref=e454]:
                    - strong [ref=e455]: Multiple deployment options
                    - text: — Choose from Free (evaluation), Serverless (pay-per-operation, auto-scaling), or Dedicated (reserved compute, predictable performance).
                  - listitem [ref=e456]:
                    - strong [ref=e457]: Vector similarity search
                    - text: — Find semantically similar items using embeddings, with support for filtered, grouped, hybrid, and full-text search.
                  - listitem [ref=e458]:
                    - strong [ref=e459]: Integrated embeddings
                    - text: — Optionally connect model providers so Zilliz automatically generates vector embeddings during data ingestion.
                  - listitem [ref=e460]:
                    - strong [ref=e461]: Security & access control
                    - text: — Fine-grained RBAC, private networking, enterprise SSO, and audit logging on higher-tier plans.
                  - listitem [ref=e462]:
                    - strong [ref=e463]: Migration & backup
                    - text: — Built-in tools to migrate from Pinecone, Qdrant, MongoDB, PostgreSQL, and more, plus automated backups with cross-region copy support.
