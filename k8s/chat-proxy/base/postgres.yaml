apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-proxy-postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-proxy-postgres
spec:
  serviceName: chat-proxy-postgres
  replicas: 1
  selector:
    matchLabels:
      app: chat-proxy-postgres
  template:
    metadata:
      labels:
        app: chat-proxy-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: chatproxy
            - name: POSTGRES_USER
              value: chatproxy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-proxy-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - chatproxy
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - chatproxy
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chat-proxy-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chat-proxy-postgres
spec:
  selector:
    app: chat-proxy-postgres
  ports:
    - port: 5432
