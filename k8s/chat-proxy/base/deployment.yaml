apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-proxy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: chat-proxy
    spec:
      containers:
      - name: chat-proxy
        image: chat-proxy
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8787
          protocol: TCP
        env:
        - name: PORT
          value: "8787"
        - name: ALLOWED_ORIGINS
          value: "*"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: DATABASE_URL
        - name: INDEX_BASE_URL
          value: "http://docusaurus/llms"
        - name: DOCS_SITE_URL
          value: "http://localhost:3000"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8787
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8787
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always