apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-proxy
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: chat-proxy
        image: chat-proxy:local
        imagePullPolicy: Never
        env:
        - name: DOCS_SITE_URL
          value: "http://docusaurus"
        - name: AI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: AI_BASE_URL
        - name: AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: AI_API_KEY
        - name: AI_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: AI_MODEL
        - name: GENERAL_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: GENERAL_MODEL
        - name: RESOURCES_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: RESOURCES_MODEL
        - name: PRODUCT_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: PRODUCT_MODEL
        - name: CODE_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: CODE_MODEL
        - name: SCHEMA_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: SCHEMA_MODEL
        - name: REWRITE_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: REWRITE_MODEL
        - name: GROUNDING_MODEL
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: GROUNDING_MODEL
        - name: EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: EMBEDDING_API_KEY
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: ADMIN_API_KEY
        - name: FEISHU_APP_ID
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: FEISHU_APP_ID
        - name: FEISHU_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: FEISHU_APP_SECRET
        - name: FEISHU_HOST
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: FEISHU_HOST
        - name: FEISHU_OAUTH_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: FEISHU_OAUTH_REDIRECT_URI
        - name: ADMIN_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: ADMIN_SESSION_SECRET
        - name: ADMIN_BOOTSTRAP_OPEN_IDS
          valueFrom:
            secretKeyRef:
              name: chat-proxy-secrets
              key: ADMIN_BOOTSTRAP_OPEN_IDS