apiVersion: apps/v1
kind: Deployment
metadata:
  name: docusaurus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docusaurus
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: docusaurus
    spec:
      containers:
      - imagePullPolicy: IfNotPresent
        name: docusaurus
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 50m
            memory: 100Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      dnsPolicy: ClusterFirst
      restartPolicy: Always