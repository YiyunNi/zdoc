apiVersion: apps/v1
kind: Deployment
metadata:
  name: docusaurus
spec:
  template:
    spec:
      containers:
      - name: docusaurus
        image: docusaurus:latest
        imagePullPolicy: Never
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 100Mi