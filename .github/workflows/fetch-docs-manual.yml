name: "fetch lark docs (manual)"
on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - name: get current date
      id: date
      run: echo "::set-output name=date::$(date +'%Y%m%d')"
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: fetch english docs
      id: fetch_en_docs
      run: |
        yarn
        npx docusaurus report-to-lark -type text -m "🔥 Start building global docs..."
        npx docusaurus report-to-lark -type text -m "🔥 Fetching English docs..."
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -s3
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -post
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -s3 -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -post
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: restore translation cache
      run: |
        git fetch origin dev master
        git checkout origin/dev -- translation.db 2>/dev/null || \
        git checkout origin/master -- translation.db 2>/dev/null || true
    - name: translate to Japanese
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 Translating docs to Japanese..."
        npx docusaurus translate-i18n --locale ja-JP
        npx docusaurus mdx-parse -d i18n/ja-JP/docusaurus-plugin-content-docs/current/tutorials
        npx docusaurus mdx-parse -d i18n/ja-JP/docusaurus-plugin-content-docs/version-byoc/tutorials
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: build docsite
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 English docs fetched! Building docs..."
        npm run build
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: link checks
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 Docs built! Checking links..."
        npx docusaurus link-checks
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
    - name: fetch sdk references
      id: fetch_sdk_refs
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 Fetching SDK references..."
        npx docusaurus fetch-lark-docs -man python -src-only
        npx docusaurus fetch-lark-docs -man pymilvus25 -src-only
        npx docusaurus fetch-lark-docs -man pymilvus26 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man pymilvus26 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man javaV2 -src-only
        npx docusaurus fetch-lark-docs -man javaV225 -src-only
        npx docusaurus fetch-lark-docs -man javaV226 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man javaV226 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man node -src-only
        npx docusaurus fetch-lark-docs -man nodejs25 -src-only
        npx docusaurus fetch-lark-docs -man nodejs26 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man nodejs26 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man gov2 -src-only
        npx docusaurus fetch-lark-docs -man gov226 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man gov226 -tar zilliz -post
        npx docusaurus fetch-apifox-docs -s plugins/apifox-docs/meta/openapi.json   
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }} 
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}  
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: build docsite
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 SDK references fetched! Building docs..."
        npm run build
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: link checks
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
      run: |
        npx docusaurus report-to-lark -type text -m "🔥 Docs built! Checking links..."
        npx docusaurus link-checks
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
  failure:
    needs: fetch
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: report failure
      run : |
        yarn
        npx docusaurus report-to-lark -type text -m "🔥 Build failed! Please check the logs."
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
  success:
    needs: fetch
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: report success
      run : |
        yarn
        npx docusaurus report-to-lark -type text -m "🔥 Build succeeded! You can build docs on Jenkins now."
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
