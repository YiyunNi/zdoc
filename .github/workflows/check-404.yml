name: "check 404"

on:
  push:
    branches:
      - "feat/zdoc-redesign"
  pull_request:
    branches:
      - "feat/zdoc-redesign"

jobs:
  Check-404:
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v1

      - name: "Setup node.js"
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: "Checking"
        run: |
          node scripts/check-404.js