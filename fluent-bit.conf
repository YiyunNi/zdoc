[SERVICE]
    Flush           10
    Daemon          Off
    Log_Level       warn
    Parsers_File    /etc/fluent-bit/parsers.conf

[INPUT]
    Name            tail
    Path            /var/log/nginx/access.log
    Parser          json_access
    Tag             nginx.access
    Refresh_Interval 5

[OUTPUT]
    Name            http
    Match           nginx.access
    Host            ${LOG_HOST}
    Port            443
    URI             /api/logs
    Format          json
    tls             On
    Header          Authorization Bearer ${LOG_SECRET}
    Retry_Limit     3
