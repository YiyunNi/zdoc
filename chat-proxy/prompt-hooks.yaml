rules:
  - name: sales-lead-cta
    enabled: true
    priority: 10
    when:
      keywords: [pricing, enterprise, sales, quote, buy, cost, plan, subscription]
      agents: [product, resources]
      confidence: [low, medium]
    then:
      inject: |
        When the user asks about pricing or purchasing, include this link
        naturally in your response: [Contact Sales](https://zilliz.com/contact-sales)
      append: |
        ---
        **Want to discuss pricing?** [Talk to our sales team →](https://zilliz.com/contact-sales)

  - name: support-escalation
    enabled: true
    priority: 20
    when:
      keywords: [bug, broken, error, crash, not working, issue, problem, fail]
    then:
      inject: |
        If the user appears to be experiencing a bug or technical issue that you
        cannot resolve from documentation alone, suggest they file a support ticket
        at https://support.zilliz.com or join the community at https://discord.gg/zilliz

  - name: getting-started-guide
    enabled: false
    priority: 50
    when:
      keywords: [getting started, quickstart, tutorial, beginner, first time, new to]
      agents: [general, code]
    then:
      inject: |
        Prioritize linking to the quickstart guide:
        https://docs.zilliz.com/docs/quick-start
      append: |
        **New to Zilliz?** Check out the [Quickstart Guide →](https://docs.zilliz.com/docs/quick-start)

  - name: migration-assistance
    enabled: true
    priority: 15
    when:
      keywords: [migrate, migration, moving from, import from, pinecone, qdrant, elasticsearch, opensearch, pgvector, tencent cloud, self-hosted, milvus to zilliz]
      agents: [general, product, code]
    then:
      inject: |
        When the user asks about migrating data, refer to the migration topic reference.
        Offer the migration guide: https://docs.zilliz.com/docs/migration-overview
      append: |
        **Need migration help?** [Talk to our migration experts →](https://zilliz.com/contact-sales)

  - name: enterprise-security
    enabled: true
    priority: 20
    when:
      keywords: [sso, saml, oidc, private link, privatelink, cmek, hipaa, soc2, soc 2, rbac, ip whitelist, audit log, mfa, private endpoint]
      agents: [product, resources]
    then:
      inject: |
        Enterprise security features (SSO, CMEK, PrivateLink, SOC 2) require Dedicated Enterprise or Business Critical plans.
        Direct the user to the security docs and enterprise contact if they need these features.
      append: |
        **Enterprise security features?** [Contact our team →](https://zilliz.com/contact-sales)

  - name: cost-optimization
    enabled: true
    priority: 25
    when:
      keywords: [cost, billing, cu usage, capacity optimized, performance optimized, autoscaling, auto scaling, scale up, scale down, replica, replicas, cu estimation]
      agents: [resources, product]
    then:
      inject: |
        When discussing costs or scaling, refer to the resources topic reference for CU sizing rules and plan limits.
        Mention the pricing page: https://zilliz.com/pricing
      append: |
        **Optimize your costs** — check our [cost optimization guide](https://docs.zilliz.com/docs/cost-optimization)

  - name: sdk-reference
    enabled: true
    priority: 30
    when:
      keywords: [python sdk, pymilvus, java sdk, go sdk, node.js sdk, restful api, curl example, javascript sdk]
      agents: [code, general]
    then:
      inject: |
        The user is asking about a specific SDK. Prioritize language-appropriate code examples.
        Default to Python (MilvusClient) unless another language is explicitly requested.

  - name: advanced-search
    enabled: true
    priority: 35
    when:
      keywords: [hybrid search, rerank, reranking, rrf, filtered search, range search, grouping search, search iterator, full text search, keyword match, bm25]
      agents: [code, schema, general]
    then:
      inject: |
        The user is asking about advanced search patterns. Use the search topic reference.
        Distinguish between dense vector search, BM25 full-text search, and hybrid search.
        Explain tradeoffs in recall, latency, and cost.

  - name: data-import
    enabled: true
    priority: 40
    when:
      keywords: [import data, bulk insert, etl, data migration, parquet, json, csv, s3 import, azure blob, gcs, bulkwriter, bulk writer]
      agents: [code, schema, general]
    then:
      inject: |
        The user is asking about data import. Use the import topic reference.
        Distinguish between direct insert/upsert, bulk import, volume import, and external storage import.

  - name: troubleshooting
    enabled: true
    priority: 45
    when:
      keywords: [connection failed, timeout, slow query, high latency, out of memory, oom, disk full, cluster unavailable, connection error, not loading, load failed]
      agents: [general, resources]
    then:
      inject: |
        The user appears to be experiencing an operational issue. Suggest checking cluster health, metrics, and logs.
        If the issue cannot be resolved from documentation, suggest contacting support.
      append: |
        **Still stuck?** [File a support ticket](https://support.zilliz.com) or ask in our [Discord community](https://discord.gg/zilliz)

  - name: index-tuning
    enabled: true
    priority: 50
    when:
      keywords: [index type, hnsw, ivf, ivf_flat, flat, autoindex, index params, m, efconstruction, nlist, nprobe, build index, index tuning, recall vs latency]
      agents: [schema, code]
    then:
      inject: |
        The user is asking about index selection or tuning. Use the schema-design topic reference for index rules.
        Recommend index choices together with schema choices, not separately.
        Explain the recall/latency tradeoff.
