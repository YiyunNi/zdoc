services:
  site:
    build:
      context: .
      args:
        CHAT_ENDPOINT: /api/chat
    ports:
      - "3000:80"

  chat-proxy:
    build: ./chat-proxy
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - INDEX_BASE_URL=http://site/llms
      - DOCS_SITE_URL=http://localhost:3000
