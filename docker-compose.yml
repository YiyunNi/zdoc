services:
  site:
    build:
      context: .
      args:
        CHAT_ENDPOINT: /api/chat
    ports:
      - "3000:80"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zdoc
      POSTGRES_PASSWORD: zdoc
      POSTGRES_DB: zdoc_chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zdoc -d zdoc_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-proxy:
    build: ./chat-proxy
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - INDEX_BASE_URL=http://site/llms
      - DOCS_SITE_URL=http://localhost:3000
      - DATABASE_URL=postgresql://zdoc:zdoc@db:5432/zdoc_chat
      - DEBUG_CHAT_FLOW=${DEBUG_CHAT_FLOW:-false}
      - DEBUG_CHAT_FLOW_VERBOSE=${DEBUG_CHAT_FLOW_VERBOSE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
