server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy admin dashboard to backend
    location /admin/ {
        proxy_pass http://chat-proxy:8787/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy feedback endpoint to backend
    location /feedback {
        proxy_pass http://chat-proxy:8787/feedback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }

    # Proxy health endpoint to backend
    location /health {
        proxy_pass http://chat-proxy:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy chat API to backend (SSE streaming)
    location /api/ {
        proxy_pass http://chat-proxy:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
